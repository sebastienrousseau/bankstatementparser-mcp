site_name: bankstatementparser-mcp
site_description: >-
  Model Context Protocol server exposing the bankstatementparser bank
  statement parsing library as agent tools.
site_url: https://sebastienrousseau.com/bankstatementparser-mcp/
repo_url: https://github.com/sebastienrousseau/bankstatementparser-mcp
repo_name: sebastienrousseau/bankstatementparser-mcp
copyright: >-
  &copy; 2026 <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tools: tools.md
  - Transports: transports.md
  - The suite: suite.md
  - Comparison: COMPARISON.md
  - Benchmarks: BENCHMARKS.md
  - Supported Python: POLICIES.md
  - API reference: api.md
  - Architecture decisions:
      - adr/index.md
      - Three transports, one command line: adr/0001-three-transports-one-command-line.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
  - Security: security.md
