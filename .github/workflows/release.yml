name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        default: "v0.0.1"

# Least privilege at the top level; each job opts into only what it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Build And Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create/update the GitHub Release
      id-token: write       # OIDC token for PyPI Trusted Publishing + sigstore
      attestations: write   # write SLSA build provenance attestations
    # Must match the "Environment name" set on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/bankstatementparser-mcp
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tag: ${{ env.RELEASE_TAG }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      # The release body's Highlights are the one hand-written part.
      # Refuse to publish anything when they are missing or malformed.
      - name: Check release highlights
        run: python3 scripts/release_notes.py check ".github/releases/${RELEASE_TAG}.md"

      - name: Build distributions
        run: poetry build

      - name: Check distributions
        run: twine check dist/*

      # The SLSA provenance subjects: sha256sum of each distribution,
      # base64-encoded, as slsa-github-generator's generic generator
      # expects. Taken before signing so only the wheel and sdist count.
      - name: Hash distributions for SLSA provenance
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      # SLSA Build Level 3 provenance attestations for every distribution
      # file. Bound to the exact files just built, signed via sigstore keyless
      # (Fulcio + Rekor) using the workflow's OIDC identity. Visible on the
      # GitHub workflow run page; verifiable with `gh attestation verify`.
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Trusted Publishing (OIDC) — no API token/secret required. Requires a
      # matching publisher to be configured on PyPI for this repo + workflow.
      # ``attestations: true`` emits PEP 740 sigstore attestations alongside
      # the uploaded distributions so PyPI shows them on the project page.
      # ``skip-existing`` keeps re-runs safe.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          skip-existing: true

      # Keyless sigstore signatures (Fulcio + Rekor via the workflow's OIDC
      # identity, no secrets) for every distribution, attached to the GitHub
      # release as .sig + .pem so the release is verifiably signed.
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: "v2.4.3"

      - name: Sign distributions (keyless)
        run: |
          for f in dist/*; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Publish release artifacts to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${{ github.repository }}" --clobber
          else
            # Highlights as a placeholder body; the release-notes job
            # writes the full body once the SBOMs are attached too.
            gh release create "${RELEASE_TAG}" dist/* --repo "${{ github.repository }}" --title "bankstatementparser-mcp ${RELEASE_TAG#v}" --notes-file ".github/releases/${RELEASE_TAG}.md"
          fi

  sbom:
    # Generate three supply-chain artifacts (CycloneDX 1.6 + SPDX + a
    # pip-licenses JSON manifest) and attach them to the release.
    # ``needs: publish`` ensures the release object exists before uploading.
    name: SBOM (CycloneDX + SPDX + licenses)
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write       # upload SBOM + license manifests to the Release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install runtime dependencies
        run: poetry install --no-interaction --only main

      - name: Install SBOM + license tooling (hash-pinned)
        run: pip install --require-hashes -r requirements/sbom.txt

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          cyclonedx-py environment \
            --of JSON \
            -o "bankstatementparser-mcp-${RELEASE_TAG}.cdx.json" \
            "$(poetry env info --executable)"

      - name: Generate SPDX SBOM (JSON)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          format: spdx-json
          output-file: "bankstatementparser-mcp-${{ env.RELEASE_TAG }}.spdx.json"
          upload-artifact: false
          upload-release-assets: false

      - name: Generate pip-licenses manifest
        run: |
          pip-licenses --python "$(poetry env info --executable)" \
            --format=json \
            --with-urls --with-license-file --no-license-path \
            --output-file "bankstatementparser-mcp-${RELEASE_TAG}.licenses.json"

      - name: Upload SBOMs + license manifest to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "bankstatementparser-mcp-${RELEASE_TAG}.cdx.json" \
            "bankstatementparser-mcp-${RELEASE_TAG}.spdx.json" \
            "bankstatementparser-mcp-${RELEASE_TAG}.licenses.json" \
            --repo "${{ github.repository }}" --clobber

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-bundle
          path: |
            bankstatementparser-mcp-*.cdx.json
            bankstatementparser-mcp-*.spdx.json
            bankstatementparser-mcp-*.licenses.json
          if-no-files-found: warn

  # SLSA Build Level 3 provenance for the wheel and sdist, attached to
  # the GitHub release as <name>.intoto.jsonl (what Scorecard's
  # Signed-Releases check looks for). slsa-github-generator's reusable
  # workflow must be referenced by tag, not by commit SHA: it verifies
  # its own ref to sign the provenance (see its README). Verify with
  # `slsa-verifier verify-artifact --provenance-path <file>.intoto.jsonl
  # --source-uri github.com/sebastienrousseau/bankstatementparser-mcp <artifact>`.
  provenance:
    name: SLSA provenance
    needs: [publish]
    permissions:
      actions: read     # detect the GitHub Actions environment
      id-token: write   # sign the provenance (sigstore keyless)
      contents: write   # upload the provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.publish.outputs.hashes }}"
      provenance-name: "bankstatementparser-mcp-${{ needs.publish.outputs.tag }}.intoto.jsonl"
      upload-assets: true
      upload-tag-name: "${{ needs.publish.outputs.tag }}"

  # Runs last, after the signatures, provenance and SBOMs are attached,
  # so the Checksums section covers every asset. Rewrites the title and body
  # in the suite's format (scripts/release_notes.py).
  release-notes:
    name: Write the release notes
    runs-on: ubuntu-latest
    needs: [publish, sbom, provenance]
    permissions:
      contents: write       # edit the release body
      pull-requests: read   # list the pull requests in the release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Compose and apply the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir assets
          python3 scripts/release_notes.py compose \
            --repo "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" \
            --highlights ".github/releases/${RELEASE_TAG}.md" \
            --assets assets --output release-notes.md
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --title "bankstatementparser-mcp ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
