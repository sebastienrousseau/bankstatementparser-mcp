name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Every Python the package supports (docs/POLICIES.md) on each of the
    # three operating systems it claims to run on.
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # requirements/ci.txt is exported from poetry.lock with hashes
      # (scripts/export_locked_requirements.py), so every job installs the
      # locked core, runtime and dev tools; the package itself goes on top
      # without resolving anything further.
      - name: Install locked dependencies + this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      - name: Run tests with the 100% coverage gate
        run: |
          pytest tests/ \
            --cov=bankstatementparser_mcp --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100 -v
          # Not a timing gate -- wall-clock is not comparable between
          # runners. This proves the benchmark still runs against the
          # current API rather than rotting into a file that reads as
          # verified and is not.
          python benches/bench_detect_and_parse.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml bankstatementparser_mcp

      - name: Upload coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml

  test-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the test matrix, so adding or dropping a version never
    # renames a required check.
    name: Test (all)
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies + this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      - name: Locked requirement exports match poetry.lock
        run: |
          python scripts/export_locked_requirements.py --with dev --output "$RUNNER_TEMP/ci.txt"
          diff -u requirements/ci.txt "$RUNNER_TEMP/ci.txt"
          python scripts/export_locked_requirements.py --output "$RUNNER_TEMP/runtime.txt"
          diff -u requirements/runtime.txt "$RUNNER_TEMP/runtime.txt"
          python scripts/export_locked_requirements.py --with fuzz --output "$RUNNER_TEMP/fuzz.txt"
          diff -u requirements/fuzz.txt "$RUNNER_TEMP/fuzz.txt"
          python scripts/export_locked_requirements.py --with docs --output "$RUNNER_TEMP/docs.txt"
          diff -u requirements/docs.txt "$RUNNER_TEMP/docs.txt"

      - name: Ruff check
        run: ruff check bankstatementparser_mcp/ tests/ fuzz/

      - name: Black check
        run: black --check bankstatementparser_mcp/ tests/ benches/ fuzz/

      - name: Mypy
        run: mypy bankstatementparser_mcp/

      - name: Complexity baseline
        run: python3 scripts/check_complexity.py

      # completions/ is generated from the server's own parser by shtab
      # (make completions); a flag change that leaves it stale fails here.
      - name: Shell completions match the parser
        run: |
          shtab --shell=bash --prog bankstatementparser-mcp \
            bankstatementparser_mcp.completion.parser > "$RUNNER_TEMP/completion.bash"
          diff -u completions/bankstatementparser-mcp.bash "$RUNNER_TEMP/completion.bash"
          shtab --shell=zsh --prog bankstatementparser-mcp \
            bankstatementparser_mcp.completion.parser > "$RUNNER_TEMP/completion.zsh"
          diff -u completions/_bankstatementparser-mcp "$RUNNER_TEMP/completion.zsh"

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked runtime dependencies + this package
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install --no-deps -e .

      - name: Run examples
        run: |
          for f in examples/*.py; do echo "=== $f ==="; python "$f"; done

  fuzz:
    # Coverage-guided fuzzing of every payload-taking tool with Atheris
    # (libFuzzer). The target fails on any exception other than the
    # ToolError the tools promise, so a crash here is a real defect.
    name: Fuzz (Atheris)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies + this package
        run: |
          pip install --require-hashes -r requirements/fuzz.txt
          pip install --no-deps -e .

      - name: Fuzz the MCP tools
        run: |
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/crashes"
          python fuzz/fuzz_tools.py "$RUNNER_TEMP/corpus" \
            -max_total_time=120 -timeout=25 \
            -artifact_prefix="$RUNNER_TEMP/crashes/"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes/

  smoke:
    name: Smoke test (installed wheel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      # Build the wheel and install it into a *clean* virtualenv so the
      # only code on sys.path is the installed artifact (the source tree
      # is deliberately excluded). This pulls bankstatementparser + mcp
      # from PyPI and catches packaging / CI-vs-local divergence.
      - name: Build the wheel
        run: |
          pip install --require-hashes -r requirements/ci.txt
          python -m build

      - name: Install the wheel into a clean venv
        run: |
          # The venv's bundled pip installs a wheel; upgrading it would be
          # an unpinned download the rest of the job does not need.
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl

      - name: Verify the installed artifact
        run: |
          "$RUNNER_TEMP/smoke/bin/python" -c "import bankstatementparser_mcp; print(bankstatementparser_mcp.__version__)"

      - name: Run an example against the installed package
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/examples/01_mcp_tools.py"
