name: Publish to MCP Registry

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      # The MCP Registry validates PyPI ownership by fetching the
      # PyPI JSON API and matching the `mcp-name:` marker in the
      # README. release.yml (which publishes to PyPI) runs in
      # parallel with this workflow on the same tag, so we must
      # wait for PyPI to surface the new version before calling
      # mcp-publisher; otherwise the first-time publish 404s on
      # ownership verification.
      - name: Wait for PyPI to surface this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PKG="bankstatementparser-mcp"
          for i in $(seq 1 60); do
            if curl -sfo /dev/null "https://pypi.org/pypi/${PKG}/${VERSION}/json"; then
              echo "PyPI surfaced ${PKG}==${VERSION} after $((i * 5))s"
              exit 0
            fi
            echo "Waiting for PyPI to surface ${PKG}==${VERSION} (attempt ${i}/60)…"
            sleep 5
          done
          echo "::error::PyPI did not surface ${PKG}==${VERSION} within 5 minutes"
          exit 1

      # A fixed release, checked against the SHA-256 its release publishes
      # in registry_<version>_checksums.txt, rather than whatever "latest"
      # serves at run time: this binary runs with the job's OIDC token.
      # Move both lines together when updating.
      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: "1.8.16"
          MCP_PUBLISHER_SHA256: "6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05"
        run: |
          set -euo pipefail
          curl -fsSLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
