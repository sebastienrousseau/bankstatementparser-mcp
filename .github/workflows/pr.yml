name: PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: PR sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install bankstatementparser + this package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install "bankstatementparser>=0.0.11"
          pip install -e .
          pip install pytest pytest-cov interrogate hypothesis 'tomli; python_version<"3.11"' ruff black mypy types-jsonschema

      - name: Lint
        run: |
          ruff check bankstatementparser_mcp/ tests/
          black --check bankstatementparser_mcp/ tests/ benches/

      - name: Type check
        run: mypy bankstatementparser_mcp/

      - name: Tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=bankstatementparser_mcp --cov-branch \
            --cov-report=xml --cov-report=term \
            --cov-fail-under=100

      - name: Docstring coverage
        run: interrogate -c pyproject.toml bankstatementparser_mcp

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
